name: exp2_concurrency

model: Qwen/Qwen3-0.6B

workload:
  requests_per_concurrency: 64
  concurrency_levels: [1, 2, 4, 8, 6, 32]

request:
  prompt: "Explain the difference between GPU and CPU in simple terms."
  max_tokens: 128
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0.0
  enable_thinking: false
  stream: true
  ignore_eos: true
